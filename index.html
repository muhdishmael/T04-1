<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		body {
			margin: 0;
			padding: 2rem;
			background: #f4f6f2;
			color: #26332c;
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			max-width: 800px;
			margin: 0 auto;
		}

		svg {
			display: block;
			width: 100%;
			height: auto;
			border: 2px solid #596b58;
			background: #d9eff5;
		}

		#scene-original,
		#scene-annotated-figure {
			margin: 0 0 1rem;
		}

		#scene-annotated #annotations {
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
			pointer-events: none;
		}

		#scene-annotated #annotations text {
			stroke: none;
		}

		#scene-annotated #annotations line {
			fill: none;
		}
	</style>
</head>
<body>
	<main>
		<figure id="scene-original">
			<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
				<title id="scene-title">A little house and garden</title>
				<desc id="scene-desc">A sunny garden with a cloud, leafy tree, red-roofed house, white fence, and curved garden path.</desc>

				<rect x="0" y="340" width="800" height="160" fill="#9bc77a" />

				<circle cx="690" cy="85" r="42" fill="#f5c84c" />

				<ellipse cx="117" cy="111" rx="26" ry="19" fill="#fff" />
				<ellipse cx="169" cy="113" rx="29" ry="17" fill="#fff" />

				<rect x="106" y="250" width="24" height="112" fill="#805337" />
				<circle cx="118" cy="218" r="48" fill="#4d8c50" />
				<circle cx="87" cy="241" r="31" fill="#5b9c59" />
				<circle cx="148" cy="243" r="32" fill="#5b9c59" />

				<rect x="290" y="240" width="260" height="170" fill="#f1d5a5" stroke="#76553b" stroke-width="3" />
				<polygon points="265,248 420,125 575,248" fill="#b94e3d" stroke="#763b32" stroke-width="4" />
				<rect x="475" y="158" width="34" height="65" fill="#a95842" stroke="#763b32" stroke-width="3" />
				<rect x="390" y="320" width="62" height="90" fill="#76513a" stroke="#543a2d" stroke-width="3" />
				<circle cx="438" cy="366" r="4" fill="#f4d36a" />

				<rect x="320" y="274" width="58" height="52" fill="#bde5ed" stroke="#76553b" stroke-width="4" />
				<line x1="349" y1="274" x2="349" y2="326" stroke="#76553b" stroke-width="3" />
				<line x1="320" y1="300" x2="378" y2="300" stroke="#76553b" stroke-width="3" />
				<rect x="463" y="274" width="58" height="52" fill="#bde5ed" stroke="#76553b" stroke-width="4" />
				<line x1="492" y1="274" x2="492" y2="326" stroke="#76553b" stroke-width="3" />
				<line x1="463" y1="300" x2="521" y2="300" stroke="#76553b" stroke-width="3" />

				<polyline points="35,390 765,390" fill="none" stroke="#f7f2df" stroke-width="7" />

				<line x1="115" y1="370" x2="115" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="182" y1="370" x2="182" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="249" y1="370" x2="249" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="560" y1="370" x2="560" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="627" y1="370" x2="627" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="694" y1="370" x2="694" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="761" y1="370" x2="761" y2="438" stroke="#f7f2df" stroke-width="7" />

				<text x="400" y="474" text-anchor="middle" fill="#304a34" font-size="21">Home in the garden</text>
			</svg>
			<figcaption>Original scene</figcaption>
		</figure>

				<circle cx="438" cy="366" r="4" fill="#f4d36a" />

				<rect x="320" y="274" width="58" height="52" fill="#bde5ed" stroke="#76553b" stroke-width="4" />
				<line x1="349" y1="274" x2="349" y2="326" stroke="#76553b" stroke-width="3" />
				<line x1="320" y1="300" x2="378" y2="300" stroke="#76553b" stroke-width="3" />
				<rect x="463" y="274" width="58" height="52" fill="#bde5ed" stroke="#76553b" stroke-width="4" />

				<line x1="761" y1="370" x2="761" y2="438" stroke="#f7f2df" stroke-width="7" />

				<text x="400" y="474" text-anchor="middle" fill="#304a34" font-size="21">Home in the garden</text>

				<g id="annotations">
					<line x1="660" y1="36" x2="676" y2="53" />
					<text x="565" y="30" stroke="none">circle (cx=690, cy=85, r=42)</text>

					<line x1="205" y1="267" x2="130" y2="275" />
					<text x="12" y="270" stroke="none">rect (x=106, y=250, width=24, height=112)</text>

					<line x1="208" y1="142" x2="173" y2="124" />
					<text x="12" y="148" stroke="none">ellipse (cx=145, cy=105, rx=48, ry=23)</text>

					<line x1="300" y1="348" x2="349" y2="300" />

					<line x1="582" y1="204" x2="550" y2="232" />
					<text x="575" y="199" stroke="none">polygon (265,248 420,125 575,248)</text>

					<text x="560" y="450" stroke="none">text (x=400, y=474)</text>
				</g>
			</svg>
			<figcaption>Annotated scene (Step 2)</figcaption>
		</figure>
	</main>
</body>
</html>
