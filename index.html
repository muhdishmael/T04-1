<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		body {
			margin: 0;
			padding: 2rem;
			background: #f4f6f2;
			color: #26332c;
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			max-width: 800px;
			margin: 0 auto;
		}

		svg {
			display: block;
			width: 100%;
			height: auto;
			border: 2px solid #596b58;
			background: #d9eff5;
		}

		#scene-original,
		#scene-annotated-figure {
			margin: 0 0 1rem;
		}

		#scene-annotated #annotations {
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
			pointer-events: none;
		}

		#scene-annotated #annotations text {
			stroke: none;
		}

		#scene-annotated #annotations line {
			fill: none;
		}

		#scene-adjusted-figure {
			margin: 0 0 1rem;
		}

		/* Give the adjusted scene stronger color and varied outline weights. */
		#scene-adjusted .sky {
			fill: #c8e8f0;
		}

		#scene-adjusted .ground {
			fill: #75ad61;
		}

		#scene-adjusted .sun {
			stroke: #8c5c00;
			stroke-width: 3;
		}

		#scene-adjusted .cloud {
			stroke: #60777c;
			stroke-width: 2;
		}

		#scene-adjusted .tree-trunk {
			stroke: #493524;
			stroke-width: 2;
		}

		#scene-adjusted .tree-canopy {
			stroke: #275b37;
			stroke-width: 2;
		}

		#scene-adjusted .house-body {
			stroke: #5a402f;
			stroke-width: 4;
		}

		#scene-adjusted .roof {
			stroke: #642f2a;
			stroke-width: 5;
		}

		#scene-adjusted .chimney,
		#scene-adjusted .door,
		#scene-adjusted .window {
			stroke: #47372e;
			stroke-width: 3;
		}

		#scene-adjusted .fence {
			stroke: #fff9e8;
			stroke-width: 4;
			stroke-dasharray: 12 7;
		}

		#scene-adjusted .stone-path {
			stroke: #625a4c;
			stroke-width: 2;
		}

		#scene-adjusted .mailbox {
			stroke: #49382d;
			stroke-width: 2;
		}

		#scene-adjusted .smoke {
			fill: #71838a;
			opacity: 0.38;
		}
	</style>
</head>
<body>
	<main>
		<figure id="scene-original">
			<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
				<title id="scene-title">A little house and garden</title>
				<desc id="scene-desc">A sunny garden with a cloud, leafy tree, red-roofed house, white fence, and curved garden path.</desc>

				<rect x="0" y="0" width="800" height="340" fill="#d9eff5" />
				<rect x="0" y="340" width="800" height="160" fill="#9bc77a" />

				<circle cx="690" cy="85" r="42" fill="#f5c84c" />
				<ellipse cx="145" cy="105" rx="48" ry="23" fill="#fff" />
				<ellipse cx="117" cy="111" rx="26" ry="19" fill="#fff" />
				<ellipse cx="169" cy="113" rx="29" ry="17" fill="#fff" />

				<rect x="106" y="250" width="24" height="112" fill="#805337" />
				<circle cx="118" cy="218" r="48" fill="#4d8c50" />
				<circle cx="87" cy="241" r="31" fill="#5b9c59" />
				<circle cx="148" cy="243" r="32" fill="#5b9c59" />

				<path d="M 366 500 C 400 450, 378 416, 415 382 C 442 358, 455 350, 468 340 L 535 340 C 516 376, 486 397, 477 430 C 468 458, 489 478, 508 500 Z" fill="#d8c79b" />

				<rect x="290" y="240" width="260" height="170" fill="#f1d5a5" stroke="#76553b" stroke-width="3" />
				<polygon points="265,248 420,125 575,248" fill="#b94e3d" stroke="#763b32" stroke-width="4" />
				<rect x="475" y="158" width="34" height="65" fill="#a95842" stroke="#763b32" stroke-width="3" />
				<rect x="390" y="320" width="62" height="90" fill="#76513a" stroke="#543a2d" stroke-width="3" />
				<circle cx="438" cy="366" r="4" fill="#f4d36a" />

				<rect x="320" y="274" width="58" height="52" fill="#bde5ed" stroke="#76553b" stroke-width="4" />
				<line x1="349" y1="274" x2="349" y2="326" stroke="#76553b" stroke-width="3" />
				<line x1="320" y1="300" x2="378" y2="300" stroke="#76553b" stroke-width="3" />
				<rect x="463" y="274" width="58" height="52" fill="#bde5ed" stroke="#76553b" stroke-width="4" />
				<line x1="492" y1="274" x2="492" y2="326" stroke="#76553b" stroke-width="3" />
				<line x1="463" y1="300" x2="521" y2="300" stroke="#76553b" stroke-width="3" />

				<polyline points="35,390 765,390" fill="none" stroke="#f7f2df" stroke-width="7" />
				<line x1="48" y1="370" x2="48" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="115" y1="370" x2="115" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="182" y1="370" x2="182" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="249" y1="370" x2="249" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="560" y1="370" x2="560" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="627" y1="370" x2="627" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="694" y1="370" x2="694" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="761" y1="370" x2="761" y2="438" stroke="#f7f2df" stroke-width="7" />

				<text x="400" y="474" text-anchor="middle" fill="#304a34" font-size="21">Home in the garden</text>
			</svg>
			<figcaption>Original scene</figcaption>
		</figure>

		<figure id="scene-annotated-figure">
			<svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="scene-annotated-title scene-annotated-desc" xmlns="http://www.w3.org/2000/svg">
				<title id="scene-annotated-title">A little house and garden, annotated</title>
				<desc id="scene-annotated-desc">The original house and garden scene with coordinate labels for example SVG shapes.</desc>

				<rect x="0" y="0" width="800" height="340" fill="#d9eff5" />
				<rect x="0" y="340" width="800" height="160" fill="#9bc77a" />

				<circle cx="690" cy="85" r="42" fill="#f5c84c" />
				<ellipse cx="145" cy="105" rx="48" ry="23" fill="#fff" />
				<ellipse cx="117" cy="111" rx="26" ry="19" fill="#fff" />
				<ellipse cx="169" cy="113" rx="29" ry="17" fill="#fff" />

				<rect x="106" y="250" width="24" height="112" fill="#805337" />
				<circle cx="118" cy="218" r="48" fill="#4d8c50" />
				<circle cx="87" cy="241" r="31" fill="#5b9c59" />
				<circle cx="148" cy="243" r="32" fill="#5b9c59" />

				<path d="M 366 500 C 400 450, 378 416, 415 382 C 442 358, 455 350, 468 340 L 535 340 C 516 376, 486 397, 477 430 C 468 458, 489 478, 508 500 Z" fill="#d8c79b" />

				<rect x="290" y="240" width="260" height="170" fill="#f1d5a5" stroke="#76553b" stroke-width="3" />
				<polygon points="265,248 420,125 575,248" fill="#b94e3d" stroke="#763b32" stroke-width="4" />
				<rect x="475" y="158" width="34" height="65" fill="#a95842" stroke="#763b32" stroke-width="3" />
				<rect x="390" y="320" width="62" height="90" fill="#76513a" stroke="#543a2d" stroke-width="3" />
				<circle cx="438" cy="366" r="4" fill="#f4d36a" />

				<rect x="320" y="274" width="58" height="52" fill="#bde5ed" stroke="#76553b" stroke-width="4" />
				<line x1="349" y1="274" x2="349" y2="326" stroke="#76553b" stroke-width="3" />
				<line x1="320" y1="300" x2="378" y2="300" stroke="#76553b" stroke-width="3" />
				<rect x="463" y="274" width="58" height="52" fill="#bde5ed" stroke="#76553b" stroke-width="4" />
				<line x1="492" y1="274" x2="492" y2="326" stroke="#76553b" stroke-width="3" />
				<line x1="463" y1="300" x2="521" y2="300" stroke="#76553b" stroke-width="3" />

				<polyline points="35,390 765,390" fill="none" stroke="#f7f2df" stroke-width="7" />
				<line x1="48" y1="370" x2="48" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="115" y1="370" x2="115" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="182" y1="370" x2="182" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="249" y1="370" x2="249" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="560" y1="370" x2="560" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="627" y1="370" x2="627" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="694" y1="370" x2="694" y2="438" stroke="#f7f2df" stroke-width="7" />
				<line x1="761" y1="370" x2="761" y2="438" stroke="#f7f2df" stroke-width="7" />

				<text x="400" y="474" text-anchor="middle" fill="#304a34" font-size="21">Home in the garden</text>

				<g id="annotations">
					<line x1="660" y1="36" x2="676" y2="53" />
					<text x="565" y="30" stroke="none">circle (cx=690, cy=85, r=42)</text>

					<line x1="205" y1="267" x2="130" y2="275" />
					<text x="12" y="270" stroke="none">rect (x=106, y=250, width=24, height=112)</text>

					<line x1="208" y1="142" x2="173" y2="124" />
					<text x="12" y="148" stroke="none">ellipse (cx=145, cy=105, rx=48, ry=23)</text>

					<line x1="300" y1="348" x2="349" y2="300" />
					<text x="220" y="356" stroke="none">line (320, 300) → (378, 300)</text>

					<line x1="582" y1="204" x2="550" y2="232" />
					<text x="575" y="199" stroke="none">polygon (265,248 420,125 575,248)</text>

					<line x1="557" y1="314" x2="535" y2="340" />
					<text x="555" y="309" stroke="none">path M366 500 C400 450 L535 340</text>

					<line x1="104" y1="447" x2="35" y2="390" />
					<text x="12" y="455" stroke="none">polyline (35,390 765,390)</text>

					<line x1="560" y1="452" x2="486" y2="470" />
					<text x="560" y="450" stroke="none">text (x=400, y=474)</text>
				</g>
			</svg>
			<figcaption>Annotated scene (Step 2)</figcaption>
		</figure>

		<figure id="scene-adjusted-figure">
			<svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="scene-adjusted-title scene-adjusted-desc" xmlns="http://www.w3.org/2000/svg">
				<title id="scene-adjusted-title">A little house and garden, adjusted</title>
				<desc id="scene-adjusted-desc">A balanced house and tree in a garden, with a dashed fence, stone path, mailbox, and chimney smoke.</desc>

				<rect class="sky" x="0" y="0" width="800" height="340" />
				<rect class="ground" x="0" y="340" width="800" height="160" />

				<circle class="sun" cx="690" cy="85" r="42" fill="#f5c84c" />
				<ellipse class="cloud" cx="145" cy="105" rx="48" ry="23" fill="#fff" />
				<ellipse class="cloud" cx="117" cy="111" rx="26" ry="19" fill="#fff" />
				<ellipse class="cloud" cx="169" cy="113" rx="29" ry="17" fill="#fff" />

				<!-- Slightly shift the tree right to balance the house. -->
				<g transform="translate(12,-4)">
					<rect class="tree-trunk" x="106" y="250" width="24" height="112" fill="#76503a" />
					<circle class="tree-canopy" cx="118" cy="218" r="48" fill="#397b45" />
					<circle class="tree-canopy" cx="87" cy="241" r="31" fill="#4c8f50" />
					<circle class="tree-canopy" cx="148" cy="243" r="32" fill="#4c8f50" />
				</g>

				<path d="M 366 500 C 400 450, 378 416, 415 382 C 442 358, 455 350, 468 340 L 535 340 C 516 376, 486 397, 477 430 C 468 458, 489 478, 508 500 Z" fill="#cfc39e" />

				<!-- Nudge the house right for a more even gap beside the tree. -->
				<g transform="translate(8,0)">
					<rect class="house-body" x="290" y="240" width="260" height="170" fill="#f0d39a" />
					<polygon class="roof" points="265,248 420,125 575,248" fill="#aa4035" />
					<rect class="chimney" x="475" y="158" width="34" height="65" fill="#984438" />
					<rect class="door" x="390" y="320" width="62" height="90" fill="#68432f" />
					<circle cx="438" cy="366" r="4" fill="#f3d366" />

					<rect class="window" x="320" y="274" width="58" height="52" fill="#a8dce8" />
					<line x1="349" y1="274" x2="349" y2="326" stroke="#47372e" stroke-width="2" />
					<line x1="320" y1="300" x2="378" y2="300" stroke="#47372e" stroke-width="2" />
					<rect class="window" x="463" y="274" width="58" height="52" fill="#a8dce8" />
					<line x1="492" y1="274" x2="492" y2="326" stroke="#47372e" stroke-width="2" />
					<line x1="463" y1="300" x2="521" y2="300" stroke="#47372e" stroke-width="2" />
				</g>

				<!-- Add a curved stone walk from the door to the garden path. -->
				<path class="stone-path" d="M 414 500 C 420 466, 434 438, 437 408 L 453 408 C 450 443, 438 476, 432 500 Z" fill="#d8cba8" />
				<path d="M 419 482 C 424 461, 433 442, 438 424" fill="none" stroke="#aaa084" stroke-width="2" />
				<path d="M 431 489 C 435 468, 444 448, 446 430" fill="none" stroke="#aaa084" stroke-width="2" />

				<!-- Build the fence with a visible dashed stroke. -->
				<polyline class="fence" points="35,390 765,390" fill="none" />
				<line class="fence" x1="48" y1="370" x2="48" y2="438" />
				<line class="fence" x1="115" y1="370" x2="115" y2="438" />
				<line class="fence" x1="182" y1="370" x2="182" y2="438" />
				<line class="fence" x1="249" y1="370" x2="249" y2="438" />
				<line class="fence" x1="560" y1="370" x2="560" y2="438" />
				<line class="fence" x1="627" y1="370" x2="627" y2="438" />
				<line class="fence" x1="694" y1="370" x2="694" y2="438" />
				<line class="fence" x1="761" y1="370" x2="761" y2="438" />

				<!-- Place a mailbox beside the new path. -->
				<rect class="mailbox" x="470" y="412" width="8" height="38" fill="#664833" />
				<polygon class="mailbox" points="463,413 463,400 486,400 493,406 493,421 463,421" fill="#b84b3e" />

				<!-- A light cluster of ellipses suggests smoke without obscuring the sky. -->
				<g class="smoke" transform="translate(8,0)">
					<ellipse cx="519" cy="148" rx="7" ry="5" />
					<ellipse cx="529" cy="136" rx="9" ry="6" />
					<ellipse cx="542" cy="124" rx="11" ry="7" />
				</g>

				<text x="400" y="474" text-anchor="middle" fill="#263e2b" font-size="21">Home in the garden</text>
			</svg>
			<figcaption>Adjusted scene (Step 3)</figcaption>
		</figure>
	</main>
</body>
</html>
